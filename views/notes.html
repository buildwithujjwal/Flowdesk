<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flowdesk</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⏳</text></svg>"> <!-- small icon in the tab, also stops the favicon.ico 404 error -->
    <link rel="stylesheet" href="../css/nav.css">
    <link rel="stylesheet" href="../css/notes.css">
    <script src="../js/auth-gaurd.js"></script>
    <script src="../js/nav.js"></script>
    <script src="../js/notes.js" defer></script>
</head>
<body>

    <div id="nav-placeholder"></div>

    <div class="notes-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>Notes</h2>
                <button id="new-note-btn" aria-label="New note">+</button>
            </div>
            <div class="notes-section">
                <button id="all-notes-btn" class="section-label">All Notes</button>
            </div>
            <div class="category-section">
                <p class="section-label">Categories</p>
                <ul id="category-list"></ul>
            </div>
        </aside>

        <!-- drag bar to resize the sidebar -->
        <div class="resizer" data-column=".sidebar" data-direction="1"></div>

        <main class="editor-area">
            <div class="empty-state" id="empty-state">
                <p>Select a note or create a new one</p>
            </div>
            <div class="note-editor" id="note-editor" style="display:none;">

                <input type="text" id="note-title" placeholder="Note Title" aria-label="Note title">
                <select id="note-category" aria-label="Category">
                    <option value="">No Category</option>
                    <option value="__new__">+ Add New Category</option>
                </select>
                <input type="text" id="new-category-input" placeholder="New category name" aria-label="New category name" style="display:none;">

                <div id="note-content" contenteditable="true" placeholder="Start writing..." role="textbox" aria-multiline="true" aria-label="Note content"></div>
                <p id="error" role="alert"></p>
                <div class="editor-actions">
                    <button id="save-note-btn">Save</button>
                    <button id="delete-note-btn">Delete</button>
                    <button id="close-editor-btn" aria-label="Close editor">✕</button>
                </div>
            </div>
        </main>

        <!-- drag bar to resize the cards area (direction -1 because it sits on the right side) -->
        <div class="resizer" data-column=".cards-area" data-direction="-1"></div>

        <section class="cards-area">
            <div class="cards-header">
                <h3 id="cards-title">All Notes</h3>
                <input type="text" id="search-input" placeholder="Search..." aria-label="Search notes by title">
            </div>
            <div class="cards-grid" id="cards-grid"></div>
        </section>
    </div>
</body>
</html>
